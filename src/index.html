<!DOCTYPE html>
<html lang="uk" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Калькулятор хлібних одиниць</title>
    <meta name="theme-color" content="#0f9d8f">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="./css/style.min.css?v=2">
    <script>
        // Apply the saved/preferred theme before first paint to avoid a flash.
        (function () {
            document.documentElement.classList.add("js");
            try {
                var t = localStorage.getItem("buc-theme");
                if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div class="wrapper">

    <!-- Main Page -->
    <main class="main">

        <!-- calculator -->
    @@include('./html/_calculator-diabetes.html')

    </main>

    </div>



    <script src="./js/scripts.min.js"></script>
</body>



</html>
